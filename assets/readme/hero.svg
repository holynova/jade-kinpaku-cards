<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%">
  <title>玉石浮雕卡牌馆 · 金箔版 — Neo Kinpaku</title>
  <desc>Black lacquer backdrop, vertical gold title rail, and two jade cards mid-flip: front face King of Spades and the jade medallion back.</desc>
  <defs>
    <radialGradient id="glow" cx="78%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#d9a441" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#d9a441" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e5d46"/>
      <stop offset="55%" stop-color="#1e3d2f"/>
      <stop offset="100%" stop-color="#16301f"/>
    </linearGradient>
    <linearGradient id="goldline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0cd7a"/>
      <stop offset="50%" stop-color="#d9a441"/>
      <stop offset="100%" stop-color="#a67c2e"/>
    </linearGradient>
  </defs>
  <g>
    <rect width="1200" height="440" rx="16" fill="#121110"/>
    <rect width="1200" height="440" rx="16" fill="url(#glow)"/>
    <line x1="118" y1="0" x2="118" y2="440" stroke="#d9a441" stroke-width="1" stroke-opacity="0.22"/>
  </g>
  <!-- vertical title rail -->
  <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="600" fill="#d9a441" text-anchor="middle">
    <text x="59" y="72">玉</text>
    <text x="59" y="118">石</text>
    <text x="59" y="164">浮</text>
    <text x="59" y="210">雕</text>
    <text x="59" y="256">卡</text>
    <text x="59" y="302">牌</text>
    <text x="59" y="348">馆</text>
  </g>
  <text x="59" y="398" text-anchor="middle" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="13" letter-spacing="2" fill="#8d8574">108</text>
  <!-- center copy -->
  <g>
    <g>
      <rect x="160" y="56" width="238" height="32" rx="16" fill="#1d1a16" stroke="#d9a441" stroke-width="1.2"/>
      <text x="279" y="78" text-anchor="middle" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="2" fill="#d9a441">NEO KINPAKU · 金箔版</text>
    </g>
    <text x="160" y="160" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="58" font-weight="800" fill="#f0cd7a">点卡翻面</text>
    <text x="160" y="210" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="#e8ddc8">黑漆底 · 金箔浮雕 · 铜绿点缀</text>
    <text x="160" y="243" font-family="'SF Mono', Monaco, Consolas, monospace" font-size="18" letter-spacing="2" fill="#9a8f7a">TAP A CARD TO FLIP</text>
    <g font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700">
      <g>
        <rect x="160" y="282" width="132" height="44" rx="10" fill="#1d1a16" stroke="#d9a441" stroke-width="1"/>
        <text x="226" y="311" text-anchor="middle" fill="#f0cd7a">108 张卡</text>
      </g>
      <g>
        <rect x="308" y="282" width="132" height="44" rx="10" fill="#1d1a16" stroke="#d9a441" stroke-width="1"/>
        <text x="374" y="311" text-anchor="middle" fill="#f0cd7a">22 个主题</text>
      </g>
      <g>
        <rect x="456" y="282" width="132" height="44" rx="10" fill="#1d1a16" stroke="#d9a441" stroke-width="1"/>
        <text x="522" y="311" text-anchor="middle" fill="#f0cd7a">手机优先</text>
      </g>
    </g>
    <text x="160" y="376" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" fill="#b8ad97">每张牌都以牌背示人，点一下才露出正面</text>
  </g>
  <!-- right: two cards mid-flip -->
  <g transform="translate(700, 52) rotate(-3 110 168)">
    <rect x="0" y="0" width="220" height="336" rx="16" fill="url(#jade)" stroke="url(#goldline)" stroke-width="3"/>
    <rect x="12" y="12" width="196" height="312" rx="10" fill="none" stroke="#d9a441" stroke-width="1" stroke-opacity="0.7"/>
    <text x="28" y="58" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#f0cd7a">K</text>
    <text x="28" y="86" font-family="Georgia, serif" font-size="23" fill="#f0cd7a">♠</text>
    <circle cx="110" cy="160" r="66" fill="#0f241a" stroke="#d9a441" stroke-width="1.5" stroke-opacity="0.8"/>
    <circle cx="132" cy="132" r="17" fill="#f0cd7a"/>
    <polygon points="56,205 92,140 118,172 140,146 164,205" fill="#3d7a58"/>
    <polygon points="56,205 84,168 106,190 128,172 164,205" fill="#2a5c41"/>
    <g fill="#cfe8d8" fill-opacity="0.85">
      <ellipse cx="86" cy="214" rx="20" ry="5"/>
      <ellipse cx="126" cy="222" rx="24" ry="6"/>
    </g>
    <text x="110" y="288" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="19" font-weight="700" fill="#e8ddc8">大闹天宫</text>
  </g>
  <!-- flip arrow -->
  <g>
    <circle cx="946" cy="214" r="19" fill="#121110" stroke="#d9a441" stroke-width="1.5"/>
    <path d="M 946 201 A 13 13 0 1 1 933 214" fill="none" stroke="#d9a441" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="933,206 931,218 941,214" fill="#d9a441"/>
  </g>
  <!-- card back -->
  <g transform="translate(968, 52) rotate(3 110 168)">
    <rect x="0" y="0" width="220" height="336" rx="16" fill="#0c0b0a" stroke="url(#goldline)" stroke-width="3"/>
    <rect x="12" y="12" width="196" height="312" rx="10" fill="none" stroke="#d9a441" stroke-width="1" stroke-opacity="0.7"/>
    <circle cx="110" cy="168" r="78" fill="none" stroke="#d9a441" stroke-width="2"/>
    <circle cx="110" cy="168" r="66" fill="#1e3d2f" stroke="#d9a441" stroke-width="1"/>
    <circle cx="110" cy="168" r="48" fill="#16301f"/>
    <polygon points="74,196 100,148 118,172 132,154 146,196" fill="#3d7a58"/>
    <polygon points="74,196 92,172 108,188 124,174 146,196" fill="#2a5c41"/>
    <g fill="#cfe8d8" fill-opacity="0.8">
      <ellipse cx="96" cy="200" rx="16" ry="4"/>
      <ellipse cx="124" cy="206" rx="18" ry="5"/>
    </g>
    <g>
      <rect x="92" y="252" width="36" height="36" rx="4" fill="#a83226"/>
      <text x="110" y="278" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="20" font-weight="700" fill="#f5e6d0">玉</text>
    </g>
  </g>
</svg>
